name: Build PS4 package

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download SDL2-PS4
        shell: bash
        run: |
          mkdir -p /tmp/sdl2
          curl -fsSL https://github.com/OpenOrbis/SDL-PS4/releases/latest/download/SDL2.tar.gz \
            | tar -xz -C /tmp/sdl2
          mkdir -p third_party/SDL-PS4/include third_party/SDL-PS4/lib
          cp -r /tmp/sdl2/include/. third_party/SDL-PS4/include/
          find /tmp/sdl2 -name libSDL2.a -exec cp {} third_party/SDL-PS4/lib/ \;
          test -f third_party/SDL-PS4/lib/libSDL2.a

      - name: Build package
        run: |
          docker run --rm \
            --user root \
            -w /workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            openorbisofficial/toolchain:latest make pkg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PS4ControllerTester
          path: out/PS4ControllerTester.pkg