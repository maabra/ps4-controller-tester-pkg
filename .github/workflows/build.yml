name: Build PS4 package

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download SDL2-PS4
        shell: bash
        run: |
          mkdir -p /tmp/sdl2
          curl -fsSL https://github.com/OpenOrbis/SDL-PS4/releases/latest/download/SDL2.tar.gz \
            | tar -xz -C /tmp/sdl2
          mkdir -p third_party/SDL-PS4/include third_party/SDL-PS4/lib
          sdl_include=$(dirname "$(find /tmp/sdl2 -type f -name SDL.h -print -quit)")
          sdl_library=$(find /tmp/sdl2 -type f -name libSDL2.a -print -quit)
          test -n "$sdl_include" && test -f "$sdl_include/SDL.h"
          test -n "$sdl_library" && test -f "$sdl_library"
          cp -r "$sdl_include"/. third_party/SDL-PS4/include/
          cp "$sdl_library" third_party/SDL-PS4/lib/libSDL2.a
          mkdir -p package-assets
          curl -fsSL https://raw.githubusercontent.com/OpenOrbis/OpenOrbis-PS4-Toolchain/master/samples/hello_world/sce_sys/icon0.png \
            -o package-assets/icon0.png
          test -s package-assets/icon0.png

      - name: Build OpenOrbis packaging tools
        shell: bash
        run: |
          mkdir -p /tmp/create-fself-bin
          curl -fsSL https://github.com/OpenOrbis/create-fself/releases/download/v1.3/binaries.tar.gz \
            | tar -xz -C /tmp/create-fself-bin
          fself=$(find /tmp/create-fself-bin -type f -name create-fself -print -quit)
          test -n "$fself" && test -f "$fself"
          cp "$fself" /tmp/create-fself
          chmod +x /tmp/create-fself

          mkdir -p /tmp/create-gp4-src
          curl -fsSL https://github.com/OpenOrbis/create-gp4/archive/refs/heads/master.tar.gz \
            | tar -xz -C /tmp/create-gp4-src --strip-components=1
          (cd /tmp/create-gp4-src/cmd/create-gp4 && go build -o /tmp/create-gp4 .)
          chmod +x /tmp/create-gp4

      - name: Build package
        run: |
          docker run --rm \
            --user root \
            -w /workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v /tmp/create-fself:/lib/OpenOrbisSDK/bin/linux/create-eboot:ro \
            -v /tmp/create-gp4:/lib/OpenOrbisSDK/bin/linux/create-gp4:ro \
            openorbisofficial/toolchain:latest make pkg
          find out -maxdepth 1 -type f -printf '%f\n'

      - name: Validate package
        run: |
          docker run --rm \
            --user root \
            -w /workspace \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            openorbisofficial/toolchain:latest \
            sh -c 'pkg=$(find out -maxdepth 1 -name "*.pkg" -print -quit); test -n "$pkg"; PkgTool.Core pkg_validate --verbose "$pkg"; PkgTool.Core pkg_listentries "$pkg" | tee /tmp/pkg-entries.txt; grep -q ICON0_PNG /tmp/pkg-entries.txt; grep -q PARAM_SFO /tmp/pkg-entries.txt'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PS4ControllerTester
          path: out/*.pkg